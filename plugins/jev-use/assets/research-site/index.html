<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>연구판</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header><div class="hd">
  <h1 id="site-title">연구판</h1>
  <nav id="tabs">
    <button data-tab="stats" class="on">주차 요약 · 통계</button>
    <button data-tab="data">자료(사례)</button>
    <button data-tab="live">라이브</button>
  </nav>
  <span id="upd"></span>
  <span class="ddw" id="reportsw" hidden><button class="dd" id="reportsbtn">지난 보고서</button>
    <div class="pop" id="reportspop"></div></span>
</div><div class="hd" style="min-height:0;padding-top:0;padding-bottom:6px">
  <span style="font-size:12px;color:var(--muted);white-space:nowrap">주차</span>
  <span id="weeksel"></span>
  <span id="archlinks" style="margin-left:auto;font-size:12px"></span>
</div></header>
<div class="page">
  <div id="frozen" hidden></div>
  <div id="banner" hidden></div>

  <!-- 통계 = 주차 요약(무엇을 알아보려 했나 → 무엇을 했나 → 무엇이 나왔나) + 질문 블록 -->
  <div id="tab-stats"><div id="weeklywrap"></div><div id="statswrap"></div></div>

  <!-- 자료 = 과제 행렬. 한 줄이 한 과제, 한 칸이 한 모델의 결과다. -->
  <div id="tab-data" hidden>
    <div id="benchbar" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 6px"></div>
    <div id="tiles"></div>
    <div id="fbar"></div>
    <section id="list" style="padding:0 0 10px">
      <div class="dtools">
        <span class="ttl" id="ltitle">과제</span>
        <span class="mid" style="display:flex;gap:4px"><button class="tb on" id="m-list">행렬</button><button class="tb" id="m-detail">사례</button></span>
        <button class="tb" id="colbtn" title="행렬에 보일 모델 열을 고릅니다">열 고르기</button>
        <span class="count" id="counter"></span>
        <span class="nav" id="rnav" hidden><button id="r-prev" title="이전 (k)">‹</button><button id="r-next" title="다음 (j) · Esc 목록">›</button></span>
      </div>
      <div id="colpop" class="pop" style="position:static;margin:8px 12px 0" hidden></div>
      <div id="legend" class="legendrow"></div>
      <div id="matwrap" class="wrap"></div>
      <div id="record" hidden>
        <div class="head">
          <span class="badge p" id="r-model"></span>
          <span class="badge" id="r-out"></span>
          <span class="meta" id="r-task"></span>
          <a class="rlink" id="r-raw" target="_blank" rel="noopener" style="margin-left:auto" hidden>원본 궤적 ↗</a>
        </div>
        <p id="r-title" class="casetitle"></p>
        <h3>모델별 결과</h3>
        <div class="others" id="r-others"></div>
        <h3>첫 오류 줄</h3>
        <div class="errline" id="r-err">기록 없음</div>
        <h3>이 시행의 사실</h3>
        <div class="kv" id="r-kv"></div>
        <p class="note">j / k 로 과제 이동 · Esc 로 행렬 · 위 칸을 누르면 같은 과제의 다른 모델</p>
      </div>
    </section>
  </div>

  <!-- 라이브 = 지금 하는 일 · 진행 중 실험 · 지도 · 피드 -->
  <div id="tab-live" hidden><div id="livewrap"></div></div>
</div>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/board.js"></script>
<script src="js/list.js"></script>
<script src="js/stats.js"></script>
<script src="js/live.js"></script>
<script>window.Site.boot();</script>
</body>
</html>
